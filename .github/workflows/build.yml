name: Build README card
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python today.py
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}  # needs repo scope to count private repos
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dark_mode.svg light_mode.svg
          if ! git diff --cached --quiet; then git commit -m 'Update README card' && git push; fi
